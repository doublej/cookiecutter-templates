name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2

      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check template sync
        run: uv run tools/sync_check.py

      - name: Enforce template version bumps
        if: github.event_name == 'pull_request'
        run: uv run tools/sync_check.py --enforce-bumps --bump-base origin/${{ github.base_ref }}

      - name: Run render tests
        run: uv run tools/render_test.py

      - name: Test update-check hook
        run: uv run tools/test_update_check.py

      - name: Test i18n check
        run: uv run tools/test_i18n_check.py

      - name: Test loc-split PoC
        run: uv run tools/test_loc_split.py

      - name: Test library-freshness check
        run: uv run tools/test_library_check.py

      - name: Upload rendered projects on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-projects-${{ matrix.os }}
          path: /tmp/cookiecutter-render-*
          retention-days: 3
