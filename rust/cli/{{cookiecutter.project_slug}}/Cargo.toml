[package]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
edition = "2024"
description = "{{ cookiecutter.description }}"
authors = ["{{ cookiecutter.author }}"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
