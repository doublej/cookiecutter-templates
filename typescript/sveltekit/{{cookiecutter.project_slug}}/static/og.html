<!doctype html>
<!--
  OG image generator — shipped with the project scaffold.
  project-atlas: https://github.com/doublej/project-atlas

  How to produce the image: serve the project, open /og.html, screenshot the
  .og-canvas element at exactly 1200x630, save it next to this file as og.png.
  `just og-check` warns while that file is missing.

  For agents: these four base classes are the contract — .og-canvas, .og-brand,
  .og-title, .og-subtitle. Do not rename or remove them. Do restyle them and the
  :root tokens to the project's real font, colors, sizes and layout, and replace
  the placeholder copy with the real brand line, title and subtitle.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OG image — {{ cookiecutter.project_name }}</title>
		<style>
			:root {
				--og-bg: #0b0b0c;
				--og-fg: #fafafa;
				--og-muted: #a1a1aa;
				--og-accent: #6366f1;
				--og-font: system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #18181b;
			}

			.og-canvas {
				box-sizing: border-box;
				width: 1200px;
				height: 630px;
				padding: 80px;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				gap: 16px;
				background: var(--og-bg);
				color: var(--og-fg);
				font-family: var(--og-font);
			}

			.og-brand {
				font-size: 28px;
				font-weight: 600;
				letter-spacing: 0.02em;
				color: var(--og-accent);
			}

			.og-title {
				margin: 0;
				font-size: 88px;
				font-weight: 700;
				line-height: 1.05;
			}

			.og-subtitle {
				margin: 0;
				max-width: 24ch;
				font-size: 34px;
				line-height: 1.3;
				color: var(--og-muted);
			}
		</style>
	</head>
	<body>
		<div class="og-canvas">
			<div class="og-brand">{{ cookiecutter.project_slug }}</div>
			<h1 class="og-title">{{ cookiecutter.project_name }}</h1>
			<p class="og-subtitle">{{ cookiecutter.description }}</p>
		</div>
	</body>
</html>
