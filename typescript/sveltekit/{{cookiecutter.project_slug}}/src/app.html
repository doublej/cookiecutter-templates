<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{ cookiecutter.project_name }}</title>
		<!-- Social preview — generated from static/og.html. Make og:image absolute once the domain is known. -->
		<meta property="og:title" content="{{ cookiecutter.project_name }}" />
		<meta property="og:description" content="{{ cookiecutter.description }}" />
		<meta property="og:image" content="/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
		<!-- Preloader: hides the page until it is hydrated, loaded (images, CSS) and its web fonts are in, capped at 4s.
		     Without JS the class is never set, so the page shows normally. Restyle #preloader freely. -->
		<style>
			.preloading body { visibility: hidden; }
			#preloader {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				background: Canvas;
				color: CanvasText;
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition: opacity 0.3s, visibility 0.3s;
			}
			.preloading #preloader { opacity: 1; visibility: visible; }
			#preloader::after {
				content: "";
				width: 2rem;
				height: 2rem;
				border: 3px solid currentColor;
				border-right-color: transparent;
				border-radius: 50%;
				animation: preloader-spin 0.8s linear infinite;
			}
			@keyframes preloader-spin { to { transform: rotate(1turn); } }
			@media (prefers-reduced-motion: reduce) { #preloader::after { animation: none; } }
		</style>
		<script>
			document.documentElement.classList.add('preloading')
			// src/lib/preloader.ts lifts this after hydration; the timer caps the wait.
			setTimeout(() => document.documentElement.classList.remove('preloading'), 4000)
		</script>
		<!-- TRACKING_PLACEHOLDER -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="preloader" aria-hidden="true"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
